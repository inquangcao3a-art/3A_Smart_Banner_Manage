name: Build smart_banner_manager 1.1.0

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build EXE and installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -m pip install -r requirements.txt
          if ($LASTEXITCODE -ne 0) { throw 'Dependency installation failed' }

          python verify_assets.py
          if ($LASTEXITCODE -ne 0) { throw 'Resource verification failed' }

          $icon = (Resolve-Path -LiteralPath 'assets/icon.ico').Path
          $installer = (Resolve-Path -LiteralPath 'installer.iss').Path

          python -m PyInstaller --noconfirm --clean --onefile --windowed --name smart_banner_manager --icon "$icon" --version-file windows-version.txt --add-data 'assets:assets' smart_banner_manager.py
          if ($LASTEXITCODE -ne 0) { throw 'Application build failed' }

          $compiler = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (!(Test-Path -LiteralPath $compiler)) {
            choco install innosetup --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'Inno Setup installation failed' }
          }

          & $compiler "/DSetupIcon=$icon" "$installer"
          if ($LASTEXITCODE -ne 0) { throw 'Installer build failed' }

          New-Item -ItemType Directory -Force -Path 'release/portable' | Out-Null
          Copy-Item 'dist/smart_banner_manager.exe' 'release/portable/'

          foreach ($file in 'release/smart_banner_manager.exe', 'release/portable/smart_banner_manager.exe') {
            $info = (Get-Item -LiteralPath $file).VersionInfo
            if ($info.FileMajorPart -ne 1 -or $info.FileMinorPart -ne 1 -or $info.FileBuildPart -ne 0) {
              throw "Expected version 1.1.0 for ${file}; got $($info.FileVersion)"
            }
          }

      - name: Verify packaged and installed application
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          function Test-BannerApp($exe, $report) {
            $process = Start-Process -FilePath $exe -WorkingDirectory $env:RUNNER_TEMP `
              -ArgumentList "--verify-build `"$report`"" -PassThru
            if (!$process.WaitForExit(60000)) {
              Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
              throw "Application did not complete verification: $exe"
            }
            if ($process.ExitCode -ne 0 -or !(Test-Path -LiteralPath $report)) {
              throw "Application verification failed: $exe (exit $($process.ExitCode))"
            }
            Get-Content -LiteralPath $report
          }

          $portable = (Resolve-Path 'release/portable/smart_banner_manager.exe').Path
          Test-BannerApp $portable (Join-Path $env:RUNNER_TEMP 'portable-check.txt')

          $setup = (Resolve-Path 'release/smart_banner_manager.exe').Path
          $installDir = Join-Path $env:RUNNER_TEMP 'smart_banner_manager_test'
          $install = Start-Process -FilePath $setup -ArgumentList @(
            '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/DIR=`"$installDir`""
          ) -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "Setup failed with exit $($install.ExitCode)" }

          Test-BannerApp (Join-Path $installDir 'smart_banner_manager.exe') (Join-Path $env:RUNNER_TEMP 'installed-check.txt')

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: smart_banner_manager
          path: |
            release/smart_banner_manager.exe
            release/portable/smart_banner_manager.exe
          if-no-files-found: error
