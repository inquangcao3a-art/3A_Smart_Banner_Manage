
name: Build 3A Smart Banner Manage 1.0.0 DIRECT FIX

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Self-test source
        run: python banner_manager.py --self-test

      - name: Build EXE
        run: python -m PyInstaller --clean --noconfirm --windowed --onefile --collect-all PIL --icon assets/app.ico --add-data "assets;assets" --version-file version.txt --name 3A_Smart_Banner_Manage banner_manager.py

      - name: Test packaged executable
        shell: pwsh
        run: |
          $p = Start-Process -FilePath ./dist/3A_Smart_Banner_Manage.exe -ArgumentList '--self-test' -Wait -PassThru
          if ($p.ExitCode -ne 0) {
            throw "EXE self-test failed"
          }

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"

          if (!(Test-Path $iscc)) {
            choco install innosetup -y
            if ($LASTEXITCODE -ne 0) {
              throw "Inno Setup installation failed"
            }
          }

          if (!(Test-Path "dist/3A_Smart_Banner_Manage.exe")) {
            throw "Application EXE missing"
          }

          & $iscc installer.iss

          if ($LASTEXITCODE -ne 0) {
            throw "Installer build failed"
          }

      - name: Verify installer exists
        shell: pwsh
        run: |
          $setup = Join-Path $env:GITHUB_WORKSPACE 'installer/3A_Smart_Banner_Manage_Setup.exe'

          if (!(Test-Path -LiteralPath $setup -PathType Leaf)) {
            throw "Setup.exe missing"
          }

          if ((Get-Item -LiteralPath $setup).Length -le 0) {
            throw "Setup.exe is empty"
          }

          Get-FileHash -LiteralPath $setup

      - name: Upload Windows Setup
        uses: actions/upload-artifact@v4
        with:
          name: 3A_Smart_Banner_Manage
          path: installer/3A_Smart_Banner_Manage_Setup.exe
          if-no-files-found: error
